# 通用模板：仅含跨机器可复用的字段。
# `[mcp_servers.openspec]` 的绝对路径占位符由 install.sh 按本机环境填充。
#
# 本文件不直接安装到 ~/.codex/config.toml：install.sh 会读取本机已有的 config.toml
# （若存在），只用本模板覆盖 model / model_reasoning_effort /
# [tui].terminal_title / [mcp_servers.openspec]；仅移除旧式 codex-notify-done.sh 的 notify，保留其余本机专属段（[projects."..."] trust_level、
# [hooks.state...] 信任哈希、[tui.model_availability_nux]、[notice.model_migrations]）。
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[tui]
terminal_title = ["thread-name"]

[mcp_servers.openspec]
command = "__OPENSPEC_PYTHON__"
args = ["-m", "openspec_mcp"]
